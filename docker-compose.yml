services:
  homegram:
    image: ghcr.io/westfox-5/homegram:${HOMEGRAM_VERSION:-latest}
    # To build from source instead: docker compose build (or uncomment the next line)
    # build: .
    container_name: homegram
    # Values come from the environment of `docker compose` (a .env file next to this
    # file, or the variables set in Portainer & co.). See .env.example.
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      DATA_DIR: ${DATA_DIR:-/data}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHOPPING_BACKEND: ${SHOPPING_BACKEND:-sqlite}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_SHOPPING_ENTITY: ${HA_SHOPPING_ENTITY:-todo.shopping_list}
      HA_TRACKER_AUTOMATION: ${HA_TRACKER_AUTOMATION:-tracker_notifica}
      HA_SCENES: ${HA_SCENES:-}
      HA_VACUUM: ${HA_VACUUM:-}
      HA_VACUUM_BATTERY: ${HA_VACUUM_BATTERY:-}
      HA_VACUUM_ERROR: ${HA_VACUUM_ERROR:-}
      HA_VACUUM_PARTS: ${HA_VACUUM_PARTS:-}
      HA_WASTE_SENSORS: ${HA_WASTE_SENSORS:-}
      WASTE_REMINDER_TIME: ${WASTE_REMINDER_TIME:-19:30}
      WASTE_REPEAT_TIME: ${WASTE_REPEAT_TIME:-21:30}
      ENERGY_SOLAR_POWER: ${ENERGY_SOLAR_POWER:-}
      ENERGY_LOAD_POWER: ${ENERGY_LOAD_POWER:-}
      ENERGY_GRID_POWER: ${ENERGY_GRID_POWER:-}
      ENERGY_BATTERY_POWER: ${ENERGY_BATTERY_POWER:-}
      ENERGY_BATTERY_SOC: ${ENERGY_BATTERY_SOC:-}
      ENERGY_SOLAR_TODAY: ${ENERGY_SOLAR_TODAY:-}
      ENERGY_LOAD_TODAY: ${ENERGY_LOAD_TODAY:-}
      ENERGY_IMPORT_TODAY: ${ENERGY_IMPORT_TODAY:-}
      ENERGY_EXPORT_TODAY: ${ENERGY_EXPORT_TODAY:-}
      ENERGY_FORECAST_TODAY: ${ENERGY_FORECAST_TODAY:-}
      ENERGY_FORECAST_TOMORROW: ${ENERGY_FORECAST_TOMORROW:-}
      ENERGY_PEAK_TOMORROW: ${ENERGY_PEAK_TOMORROW:-}
    volumes:
      # The SQLite database lives here: it survives restarts and upgrades.
      - homegram-data:/data
    extra_hosts:
      # Lets HA_URL=http://host.docker.internal:8123 reach a Home Assistant
      # running on the same host (e.g. a container with network_mode: host).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  homegram-data:
