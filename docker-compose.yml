services:
  homegram:
    image: ghcr.io/westfox-5/homegram:${HOMEGRAM_VERSION:-latest}
    # To build from source instead: docker compose build (or uncomment the next line)
    # build: .
    container_name: homegram
    # Values come from the environment of `docker compose` (a .env file next to this
    # file, or the variables set in Portainer & co.). See .env.example.
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      DATA_DIR: ${DATA_DIR:-/data}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHOPPING_BACKEND: ${SHOPPING_BACKEND:-sqlite}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_SHOPPING_ENTITY: ${HA_SHOPPING_ENTITY:-todo.shopping_list}
    volumes:
      # The SQLite database lives here: it survives restarts and upgrades.
      - homegram-data:/data
    extra_hosts:
      # Lets HA_URL=http://host.docker.internal:8123 reach a Home Assistant
      # running on the same host (e.g. a container with network_mode: host).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  homegram-data:
